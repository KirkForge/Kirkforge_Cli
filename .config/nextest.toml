# nextest repository config — see https://nexte.st/docs/configuration/reference/
# Profiles map onto the CI matrix in scripts/ci-local.sh:
#   ci-fast     -> PR fast feedback (lib tests only, fail fast, 60s slow-timeout)
#   ci-full     -> post-merge (all tests, collect all failures, 120s slow-timeout)
#   integration -> root tests/ integration suite (kind(test) excluding the
#                  feature-gated e2e binary), 300s slow-timeout
#   e2e         -> tests/e2e (gated behind --features e2e-tests, WO 28.10),
#                  600s slow-timeout

[profile.ci-fast]
# PR fast feedback: lib tests only, fail fast, tight timeout.
fail-fast = true
default-filter = "kind(lib)"
slow-timeout = "60s"

[profile.ci-full]
# Post-merge: all tests, collect all failures.
fail-fast = false
slow-timeout = "120s"

[profile.integration]
# Integration tests (cargo integration targets under tests/ and crates/*/tests/),
# excluding the feature-gated e2e binary (built separately with --features e2e-tests).
fail-fast = false
default-filter = "kind(test) - binary(e2e)"
slow-timeout = "300s"

[profile.e2e]
# E2E: very long timeout. The e2e binary only builds with --features e2e-tests
# (WO 28.10); run as: cargo nextest run --profile e2e --features e2e-tests.
fail-fast = false
default-filter = "binary(e2e)"
slow-timeout = "600s"