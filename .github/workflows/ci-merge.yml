name: CI (merge)

# Post-merge gate: full matrix on push to main/dev.
# static → {full-tests, clippy, windows, e2e} as parallel siblings.
# No Ollama, no coverage (both nightly). See ADR-074 for the tier architecture.
on:
  push:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_TOOLCHAIN: "1.88.0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap static gate: conflict markers + TOML schema + artifact
  # consistency + rustfmt. Repo-file linting runs BEFORE installing Rust.
  # Everything else depends on this only — no artificial needs chains
  # between test jobs (ADR-074).
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Lint repo files (conflict markers + TOML validity + bench schema)
        run: |
          set -euo pipefail
          # 1. No unresolved git merge-conflict markers in ANY tracked file.
          #    `<` / `>` are literal in ERE; the diff3 base marker `|||||||`
          #    must be escaped (| is the alternation operator).
          if git grep -nE '^(<<<<<<< |>>>>>>> |\|\|\|\|\|\|\| )' -- . ; then
            echo "::error::Unresolved git merge-conflict markers in tracked files."
            exit 1
          fi
          # 2. Every benches/tasks/*.toml must parse as valid TOML AND carry
          #    the required keys. The required-key set is pinned from real
          #    tasks (`name`, `difficulty`, `prompt`) —
          #    ponytail: heuristic ceiling; bump this set when a legitimate
          #    task lands without one of these keys (none today).
          #    Also validates the [verify].type against the known VerifySpec
          #    variants so a typo like `output_contains` fails CI before the
          #    bench suite fails to load (WO 39.1).
          python3 - <<'PY'
          import pathlib, sys
          try:
              import tomllib  # Python 3.11+; ubuntu-latest ships 3.12.
          except ModuleNotFoundError:
              print("::error::tomllib unavailable (need Python >=3.11 on the runner)")
              sys.exit(1)
          root = pathlib.Path("benches/tasks")
          required = ("name", "difficulty", "prompt")
          valid_verify_types = {"test_passes", "file_contains", "command_exits_zero"}
          bad = []
          checked = 0
          if root.is_dir():
              for f in sorted(root.glob("*.toml")):
                  checked += 1
                  try:
                      data = tomllib.loads(f.read_text(encoding="utf-8"))
                  except Exception as e:
                      bad.append((str(f), f"Invalid TOML: {e}"))
                      continue
                  missing = [k for k in required if k not in data]
                  if missing:
                      bad.append((str(f), f"missing required keys: {missing}"))
                  verify = data.get("verify", {})
                  vt = verify.get("type")
                  if vt is None:
                      bad.append((str(f), "missing [verify].type"))
                  elif vt not in valid_verify_types:
                      bad.append((str(f), f"unknown verify type '{vt}', expected one of {sorted(valid_verify_types)}"))
          if bad:
              for f, e in bad:
                  print(f"::error file={f}::{e}")
              sys.exit(1)
          print(f"benches/tasks/: {checked} TOML files parse OK with required keys {required} + valid verify types")
          PY

      - name: Check artifact/install/release consistency
        run: bash scripts/check-artifact-consistency.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  # Full clippy: --all-targets (compiles tests/benches/examples) for merge,
  # vs --lib --bins on PR. Clippy is the compile gate; no separate
  # `cargo check` (ADR-074). --features e2e-tests keeps the gated e2e crate
  # under the lint gate.
  clippy:
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: merge-clippy

      - name: Run Clippy (all targets)
        run: cargo clippy --all-targets --features e2e-tests --locked -- -D warnings

  # Full tests: ci-full profile (fail-fast=false, 60s slow-timeout
  # terminate-after=1, grace-period 15s, skip #[ignore]), --no-fail-fast to
  # collect all failures. Sibling of clippy (both depend on static only),
  # not a dependent of clippy. Includes a slow-test report (WO 40.3).
  full-tests:
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: merge-full-tests

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run full test suite (no-fail-fast)
        # ci-full profile: fail-fast=false, 60s slow-timeout (terminate-after=1),
        # skip #[ignore]. --workspace does not pick up the e2e crate (gated
        # behind required-features e2e-tests); the dedicated `e2e` job below
        # runs it with the feature. Output is tee'd to a log for the slow-test
        # report step below (WO 40.3).
        run: |
          set -euo pipefail
          cargo nextest run --profile ci-full --workspace --no-fail-fast --locked 2>&1 | tee nextest-full.log

      - name: Slow-test report (top 20)
        # WO 40.3: extract the top-20 slowest tests from the run log and post
        # as a CI summary. nextest prints lines like:
        #   PASS [   1.234s] crate::binary tests::test_name
        # We sort by the duration field descending and take the top 20.
        # Uses awk to parse the bracket duration; sed strips ANSI color.
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f nextest-full.log ]; then
            echo "No nextest log found; skipping slow-test report."
            exit 0
          fi
          # Strip ANSI codes, extract duration + test name, sort desc, top 20.
          # nextest lines: "PASS [   1.234s] crate::binary tests::name"
          sed 's/\x1b\[[0-9;]*m//g' nextest-full.log \
            | grep -E '^\s*(PASS|FAIL|SLOW|TIMEOUT|LEAK)\s+\[' \
            | awk -F'[][]' '{ print $2 "\t" $0 }' \
            | sort -t$'\t' -k1 -r \
            | head -20 \
            | cut -f2- > slowest-20.txt || true
          echo "::group::Top 20 slowest tests (ci-full)"
          if [ -s slowest-20.txt ]; then
            cat slowest-20.txt
          else
            echo "(no test duration lines parsed)"
          fi
          echo "::endgroup::"
          # Post as a job summary (GitHub Actions markdown).
          {
            echo "## Top 20 slowest tests (ci-full profile)"
            echo ""
            echo '```'
            cat slowest-20.txt 2>/dev/null || echo "(none)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run doctests
        # Doctests are not collected by nextest by default. Run them under
        # plain cargo test, with a hard wall-clock cap so a hanging doctest
        # cannot wedge the job (cargo test has no per-test timeout).
        run: timeout 300 cargo test --locked --doc --workspace --no-fail-fast

  # Windows tests only — NO release build. Release compile validation lives
  # in the nightly release-build job / tag-triggered release.yml (ADR-074).
  # ci-full profile (fail-fast=false, 60s slow-timeout) declaratively;
  # no inline --config flags.
  windows:
    runs-on: windows-latest
    needs: static
    timeout-minutes: 45
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests on Windows
        shell: bash
        # --workspace does not pick up the e2e crate (required-features =
        # e2e-tests); e2e runs in the dedicated job below (Linux).
        run: cargo nextest run --profile ci-full --workspace --no-fail-fast --locked

      - name: Run doctests on Windows
        # WO 43.12: mirror of the Linux full-tests :186 doctest step.
        # nextest does not collect doctests, so plain `cargo test --doc`.
        # If doctests can't pass on Windows, document the exclusion here
        # (none today — this step is the parity close).
        shell: bash
        run: cargo test --locked --doc --workspace --no-fail-fast

  # Dedicated e2e suite. The e2e integration test crate is feature-gated
  # (required-features = e2e-tests) so --workspace runs above skip it. This
  # job turns the feature on so the full e2e suite runs on every push to
  # dev/main without making every other job pay the compile + run cost.
  # e2e profile (binary(e2e), 300s slow-timeout) declaratively.
  e2e:
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run e2e suite
        run: cargo nextest run --profile e2e --features e2e-tests --no-fail-fast --locked