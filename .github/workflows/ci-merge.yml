name: CI (merge)

# Post-merge gate: full matrix on push to main/dev.
# Runs the PR gate + full tests + windows + e2e + integration.
on:
  push:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_TOOLCHAIN: "1.88.0"

concurrency:
  group: ci-merge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast-fail gate. Lint repo files BEFORE installing Rust (no toolchain
  # needed for grep/python), then check formatting. Catches the regression
  # class that disabled the old workflows: unresolved merge-conflict
  # markers committed under benches/tasks/use_*.toml (commit 4028424 fixed
  # the source; this guard prevents recurrence).
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Lint repo files (conflict markers + TOML validity + bench schema)
        run: |
          set -euo pipefail
          # 1. No unresolved git merge-conflict markers in ANY tracked file.
          #    `<` / `>` are literal in ERE; the diff3 base marker `|||||||`
          #    must be escaped (| is the alternation operator).
          if git grep -nE '^(<<<<<<< |>>>>>>> |\|\|\|\|\|\|\| )' -- . ; then
            echo "::error::Unresolved git merge-conflict markers in tracked files."
            exit 1
          fi
          # 2. Every benches/tasks/*.toml must parse as valid TOML AND carry
          #    the required keys (WO 28.11 R2). The required-key set is
          #    pinned from real tasks (`name`, `difficulty`, `prompt`) —
          #    ponytail: heuristic ceiling; bump this set when a legitimate
          #    task lands without one of these keys (none today).
          python3 - <<'PY'
          import pathlib, sys
          try:
              import tomllib  # Python 3.11+; ubuntu-latest ships 3.12.
          except ModuleNotFoundError:
              print("::error::tomllib unavailable (need Python >=3.11 on the runner)")
              sys.exit(1)
          root = pathlib.Path("benches/tasks")
          required = ("name", "difficulty", "prompt")
          bad = []
          checked = 0
          if root.is_dir():
              for f in sorted(root.glob("*.toml")):
                  checked += 1
                  try:
                      data = tomllib.loads(f.read_text(encoding="utf-8"))
                  except Exception as e:
                      bad.append((str(f), f"Invalid TOML: {e}"))
                      continue
                  missing = [k for k in required if k not in data]
                  if missing:
                      bad.append((str(f), f"missing required keys: {missing}"))
          if bad:
              for f, e in bad:
                  print(f"::error file={f}::{e}")
              sys.exit(1)
          print(f"benches/tasks/: {checked} TOML files parse OK with required keys {required}")
          PY

      - name: Check artifact/install/release consistency
        run: bash scripts/check-artifact-consistency.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    needs: fmt
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: merge-clippy

      - name: Run Clippy
        # --lib --bins (NOT --all-targets) skips test-target compilation.
        # --features e2e-tests keeps the gated e2e crate under the lint
        # gate so it cannot silently rot (WO 28.10).
        run: cargo clippy --lib --bins --features e2e-tests --locked -- -D warnings

      - name: Typecheck (lib + bins)
        run: cargo check --workspace --lib --bins --features e2e-tests --locked

  fast-tests:
    runs-on: ubuntu-latest
    needs: fmt
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: merge-tests

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run fast test suite (lib only, fail-fast)
        # ci-fast profile: kind(lib), fail-fast=true, 60s slow-timeout.
        run: cargo nextest run --profile ci-fast --workspace --lib --locked

  full-tests:
    runs-on: ubuntu-latest
    needs: [clippy, fast-tests]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: merge-full-tests

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run full test suite (no-fail-fast)
        # ci-full profile: fail-fast=false, 120s slow-timeout.
        # --workspace no longer picks up the e2e suite since WO 28.10
        # gated it behind the `e2e-tests` feature; the dedicated `e2e`
        # job below runs it with the feature on every push to dev.
        run: cargo nextest run --profile ci-full --workspace --no-fail-fast --locked

      - name: Run doctests
        # Doctests are not collected by nextest by default. Run them
        # under plain cargo test, with a hard wall-clock cap so a
        # hanging doctest cannot wedge the job (cargo test has no
        # per-test timeout of its own).
        run: timeout 300 cargo test --locked --doc --workspace --no-fail-fast

  windows:
    runs-on: windows-latest
    needs: fmt
    timeout-minutes: 45
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests on Windows (nextest; 60s per-test timeout)
        shell: bash
        # `--workspace` no longer picks up the e2e suite since WO 28.10
        # gated it behind `required-features = ["e2e-tests"]`. The e2e
        # binary-spawn scenarios were the historic Windows-flake source;
        # they now run only in the dedicated `e2e` job below (Linux).
        run: |
          cargo nextest run --locked --workspace --no-fail-fast \
            --config 'profile.default.timeout-period="60s"' \
            --config 'profile.default.fail-timeout="10s"'

  # Dedicated e2e suite (WO 28.10). The `e2e` integration test crate is
  # feature-gated (`required-features = ["e2e-tests"]`) so the default
  # `--workspace` runs above skip it. This job turns the feature on so
  # the full e2e suite still runs on every push to dev/main —
  # without making every other job pay the compile + run cost.
  e2e:
    runs-on: ubuntu-latest
    needs: fmt
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run e2e suite
        run: |
          cargo nextest run --locked --test e2e --features e2e-tests --no-fail-fast \
            --config 'profile.default.timeout-period="60s"' \
            --config 'profile.default.fail-timeout="10s"'

  integration:
    runs-on: ubuntu-latest
    needs: fmt
    timeout-minutes: 20
    env:
      TEST_MODEL: qwen2.5:0.5b
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ env.TEST_MODEL }}-${{ runner.os }}-${{ hashFiles('tests/integration_test.rs') }}
          restore-keys: |
            ollama-models-${{ env.TEST_MODEL }}-${{ runner.os }}-
            ollama-models-${{ env.TEST_MODEL }}-

      - name: Install and start Ollama
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "Ollama ready"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:11434/api/tags >/dev/null || { echo "Ollama failed to start"; cat /tmp/ollama.log; exit 1; }

      - name: Pull test model
        shell: bash
        run: |
          if ! curl -fsS http://localhost:11434/api/tags | grep -q "${TEST_MODEL}"; then
            ollama pull "${TEST_MODEL}"
          else
            echo "Test model ${TEST_MODEL} already cached"
          fi

      - name: Run integration tests against Ollama
        run: cargo test --test integration_test -- --include-ignored

      - name: Run smoke tests
        run: cargo test --test smoke_test