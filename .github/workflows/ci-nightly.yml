name: CI (nightly)

# Nightly: slow / exhaustive jobs that don't gate PRs or merges.
# Schedule + manual dispatch. cancel-in-progress: false so a partial
# nightly run is not superseded (we want the full report). See ADR-074.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_TOOLCHAIN: "1.88.0"

concurrency:
  group: ci-nightly
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info

      - name: Coverage regression gate
        run: bash scripts/check-cov-regression.sh

  # Real-model integration tests against a live Ollama instance. Network,
  # model download, GPU variance — wrong shape for PR/merge CI (ADR-074).
  # nightly profile (WO 40.3): 600s slow-timeout, --run-ignored all so
  # #[ignore] tests (real-network JWKS smoke etc.) are included.
  ollama:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_MODEL: qwen2.5:0.5b
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-ollama

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ env.TEST_MODEL }}-${{ runner.os }}-${{ hashFiles('tests/integration_test.rs') }}
          restore-keys: |
            ollama-models-${{ env.TEST_MODEL }}-${{ runner.os }}-
            ollama-models-${{ env.TEST_MODEL }}-

      - name: Install and start Ollama
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "Ollama ready"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:11434/api/tags >/dev/null || { echo "Ollama failed to start"; cat /tmp/ollama.log; exit 1; }

      - name: Pull test model
        shell: bash
        run: |
          if ! curl -fsS http://localhost:11434/api/tags | grep -q "${TEST_MODEL}"; then
            ollama pull "${TEST_MODEL}"
          else
            echo "Test model ${TEST_MODEL} already cached"
          fi

      - name: Run integration tests against Ollama (nightly profile, include ignored)
        # nightly profile: 600s slow-timeout, --run-ignored all so the 7
        # #[ignore]d Ollama tests in tests/integration_test.rs run. --test
        # integration_test scopes to that target only; -p kf-code alone
        # selects the whole package (bin unit tests + every tests/*.rs), and
        # --run-ignored all would sweep in src/tui/clipboard.rs (panics
        # headless) and every slow real-subprocess unit ignore. The
        # real-network JWKS smoke lives in kf-rbac, not kf-code (WO 44.53).
        run: cargo nextest run --profile nightly --run-ignored all --no-fail-fast --locked -p kf-code --test integration_test

      - name: Run smoke tests (nightly profile)
        run: cargo nextest run --profile nightly --no-fail-fast --locked -p kf-code --test smoke_test

  # Full e2e suite. Same as ci-merge.yml `e2e`; runs nightly so a flaky e2e
  # failure does not block merge but is still observed. e2e profile
  # (binary(e2e), 300s slow-timeout) declaratively.
  e2e-exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-e2e

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run e2e suite
        run: cargo nextest run --profile e2e --features e2e-tests --no-fail-fast --locked

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # cargo-audit reads Cargo.lock directly; it does not compile the
      # workspace, so the pinned toolchain + rust-cache are not needed.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Block on critical/high CVSS + unsound only; lower severities are
      # warnings. Severity blocking is configured in .cargo/audit.toml
      # (severity_threshold); --deny only accepts advisory *categories*.
      - name: Audit dependencies (critical/high/unsound)
        run: cargo audit --deny unsound

      - name: Audit dependencies (informational warnings)
        if: always()
        continue-on-error: true
        run: cargo audit

  # Mutation testing for assertion strength on security-critical modules
  # (ADR-074 tiering: nightly-only, slow). Informational baseline first —
  # continue-on-error per run so a surviving mutant does not fail the job.
  # Ratchet to blocking per-module only after a baseline exists. cargo-mutants
  # is a dev tool installed here via install-action; NOT in any Cargo.toml.
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-mutants

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      # One --file run per security-critical module. --file scopes mutants
      # to the named source file. -j 2 keeps CI runners responsive. Each run
      # is informational (continue-on-error) — we record the survival score,
      # not a pass/fail. Ratchet to blocking per-module after a baseline.
      #
      # WO 44.54: each run writes to its own -o dir so runs don't overwrite
      # each other. cargo-mutants creates `<dir>/mutants.out/` (containing
      # outcomes.json, missed.txt, etc.) — the prior workflow referenced
      # flat mutants.out.json/.txt files that cargo-mutants never emits.
      - name: Mutants — path_safety (kf-routing)
        continue-on-error: true
        run: cargo mutants --file crates/kf-routing/src/path_safety.rs -j 2 -o mutants-out/path_safety

      - name: Mutants — secret scrubbing (bash_runner)
        continue-on-error: true
        run: cargo mutants --file src/session/bash_runner/mod.rs -j 2 -o mutants-out/bash_runner

      - name: Mutants — audit chain (shared/audit)
        continue-on-error: true
        run: cargo mutants --file src/shared/audit.rs -j 2 -o mutants-out/audit

      - name: Mutants — sandbox (executor/sandbox)
        continue-on-error: true
        run: cargo mutants --file src/session/executor/sandbox.rs -j 2 -o mutants-out/sandbox

      - name: Upload mutants artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-report
          path: mutants-out/

      - name: Record baseline survival score
        if: always()
        shell: bash
        run: |
          {
            echo "## Mutation testing baseline"
            echo
            echo "Per-module survival score (informational; ratchet to blocking after baseline):"
            echo
            for module in path_safety bash_runner audit sandbox; do
              outcomes="mutants-out/$module/mutants.out/outcomes.json"
              echo "### $module"
              echo
              if [ -f "$outcomes" ]; then
                echo '```json'
                cat "$outcomes"
                echo '```'
              else
                echo "_$outcomes not produced — see job logs_"
              fi
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # Release compile validation on linux + windows. The tag-triggered
  # release.yml does the actual publish; this just verifies the release
  # profile compiles on both platforms overnight (ADR-074: release-build
  # validation is decoupled from the Windows test job in ci-merge).
  release-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-release-${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --workspace --target ${{ matrix.target }}