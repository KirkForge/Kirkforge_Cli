name: CI (nightly)

# Nightly: slow / exhaustive jobs that don't gate PRs or merges.
# Schedule + manual dispatch. cancel-in-progress: false so a partial
# nightly run is not superseded (we want the full report).
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_TOOLCHAIN: "1.88.0"

concurrency:
  group: ci-nightly
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-coverage

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info

      - name: Coverage regression gate
        run: bash scripts/check-cov-regression.sh

  ollama:
    # Real-model integration tests against a live Ollama instance.
    # Same suite as ci-merge.yml `integration`, renamed to match the
    # nightly "real model tests" scope.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_MODEL: qwen2.5:0.5b
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-ollama

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ env.TEST_MODEL }}-${{ runner.os }}-${{ hashFiles('tests/integration_test.rs') }}
          restore-keys: |
            ollama-models-${{ env.TEST_MODEL }}-${{ runner.os }}-
            ollama-models-${{ env.TEST_MODEL }}-

      - name: Install and start Ollama
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "Ollama ready"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:11434/api/tags >/dev/null || { echo "Ollama failed to start"; cat /tmp/ollama.log; exit 1; }

      - name: Pull test model
        shell: bash
        run: |
          if ! curl -fsS http://localhost:11434/api/tags | grep -q "${TEST_MODEL}"; then
            ollama pull "${TEST_MODEL}"
          else
            echo "Test model ${TEST_MODEL} already cached"
          fi

      - name: Run integration tests against Ollama
        run: cargo test --test integration_test -- --include-ignored

      - name: Run smoke tests
        run: cargo test --test smoke_test

  e2e-exhaustive:
    # Full e2e suite (WO 28.10). Same as ci-merge.yml `e2e`; runs nightly
    # so a flaky e2e failure does not block merge but is still observed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-e2e

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run e2e suite
        run: |
          cargo nextest run --locked --test e2e --features e2e-tests --no-fail-fast \
            --config 'profile.default.timeout-period="60s"' \
            --config 'profile.default.fail-timeout="10s"'

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # cargo-audit reads Cargo.lock directly; it does not compile the
      # workspace, so the pinned toolchain + rust-cache are not needed.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Block on critical/high CVSS + unsound only; lower severities are
      # warnings. Severity blocking is configured in .cargo/audit.toml
      # (severity_threshold); --deny only accepts advisory *categories*.
      - name: Audit dependencies (critical/high/unsound)
        run: cargo audit --deny unsound

      - name: Audit dependencies (informational warnings)
        if: always()
        continue-on-error: true
        run: cargo audit

  release-build:
    # Smoke-test release builds on linux + windows. The tag-triggered
    # release.yml does the actual publish; this just verifies the
    # release profile compiles on both platforms overnight.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-release-${{ matrix.target }}

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --workspace --target ${{ matrix.target }}