name: CI (PR)

# PR gate: fast feedback only. Target <5 min.
# Runs on PRs to main/dev. cancel-in-progress so a force-push
# supersedes the previous run. See ADR-074 for the tier architecture.
on:
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_TOOLCHAIN: "1.88.0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap static gate: conflict markers + TOML schema + artifact
  # consistency + rustfmt. Repo-file linting runs BEFORE installing Rust
  # (no toolchain needed for grep/python). Everything else depends on this.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Lint repo files (conflict markers + TOML validity + bench schema)
        run: |
          set -euo pipefail
          # 1. No unresolved git merge-conflict markers in ANY tracked file.
          #    `<` / `>` are literal in ERE; the diff3 base marker `|||||||`
          #    must be escaped (| is the alternation operator).
          if git grep -nE '^(<<<<<<< |>>>>>>> |\|\|\|\|\|\|\| )' -- . ; then
            echo "::error::Unresolved git merge-conflict markers in tracked files."
            exit 1
          fi
          # 2. Every benches/tasks/*.toml must parse as valid TOML AND carry
          #    the required keys. The required-key set is pinned from real
          #    tasks (`name`, `difficulty`, `prompt`) —
          #    ponytail: heuristic ceiling; bump this set when a legitimate
          #    task lands without one of these keys (none today).
          #    Also validates the [verify].type against the known VerifySpec
          #    variants so a typo like `output_contains` fails CI before the
          #    bench suite fails to load (WO 39.1).
          python3 - <<'PY'
          import pathlib, sys
          try:
              import tomllib  # Python 3.11+; ubuntu-latest ships 3.12.
          except ModuleNotFoundError:
              print("::error::tomllib unavailable (need Python >=3.11 on the runner)")
              sys.exit(1)
          root = pathlib.Path("benches/tasks")
          required = ("name", "difficulty", "prompt")
          valid_verify_types = {"test_passes", "file_contains", "command_exits_zero"}
          bad = []
          checked = 0
          if root.is_dir():
              for f in sorted(root.glob("*.toml")):
                  checked += 1
                  try:
                      data = tomllib.loads(f.read_text(encoding="utf-8"))
                  except Exception as e:
                      bad.append((str(f), f"Invalid TOML: {e}"))
                      continue
                  missing = [k for k in required if k not in data]
                  if missing:
                      bad.append((str(f), f"missing required keys: {missing}"))
                  verify = data.get("verify", {})
                  vt = verify.get("type")
                  if vt is None:
                      bad.append((str(f), "missing [verify].type"))
                  elif vt not in valid_verify_types:
                      bad.append((str(f), f"unknown verify type '{vt}', expected one of {sorted(valid_verify_types)}"))
          if bad:
              for f, e in bad:
                  print(f"::error file={f}::{e}")
              sys.exit(1)
          print(f"benches/tasks/: {checked} TOML files parse OK with required keys {required} + valid verify types")
          PY

      - name: Check artifact/install/release consistency
        run: bash scripts/check-artifact-consistency.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  # Classify the PR change set once and expose the affected cargo packages
  # (or a docs-only/no-rust marker) as job outputs. Both `clippy` and
  # `fast-tests` depend on this so they skip themselves on docs-only changes.
  # fetch-depth: 0 is required for `git diff <base>..HEAD` to resolve the
  # base ref.
  changes:
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 3
    outputs:
      packages: ${{ steps.cls.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: cls
        name: Classify changed packages
        # github.base_ref is the PR target branch (e.g. dev) on PR events;
        # fall back to origin/dev for push-triggered runs.
        run: |
          base="origin/${{ github.base_ref || 'dev' }}"
          # Do NOT swallow the classifier exit code: a non-zero exit (base ref
          # unresolvable, e.g. fork PRs where origin/${base_ref} doesn't
          # exist) must fail this job so the PR check suite goes red, not
          # silently green with zero Rust checks run (WO 44.52).
          pkgs="$(bash scripts/changed-packages.sh "$base")"
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"
          if [ "$pkgs" = "__NO_RUST_CHANGES__" ] || [ -z "$pkgs" ]; then
            echo "No Rust packages affected; clippy + fast-tests will skip."
          else
            echo "Affected packages: $pkgs"
          fi

  # Clippy is the compile gate. --lib --bins (NOT --all-targets) skips
  # test-target/bench/example compilation for PR speed. --features
  # e2e-tests keeps the gated e2e crate under the lint gate so it cannot
  # silently rot. No separate `cargo check`: clippy with -D warnings fails
  # on any compile error, and same-scope `cargo check` only re-runs the
  # build (ADR-074). Skipped on docs-only changes.
  clippy:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.packages != '' && needs.changes.outputs.packages != '__NO_RUST_CHANGES__'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: pr-clippy

      - name: Run Clippy
        run: cargo clippy --lib --bins --features e2e-tests --locked -- -D warnings

  # Fast tests: nextest ci-fast profile (fail-fast=true, 30s slow-timeout
  # terminate-after=1, grace-period 10s, skip #[ignore]) on changed packages
  # only. Skipped on docs-only changes. Includes a slow-test warning (WO 40.3).
  fast-tests:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.packages != '' && needs.changes.outputs.packages != '__NO_RUST_CHANGES__'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: pr-tests

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run fast test suite (changed packages only, lib only, fail-fast)
        # ci-fast profile: fail-fast=true, 30s slow-timeout (terminate-after=1),
        # grace-period 10s, skip #[ignore]. Output tee'd to a log for the
        # slow-test warning step below (WO 40.3).
        env:
          PKGS: ${{ needs.changes.outputs.packages }}
        run: |
          set -euo pipefail
          args=()
          for p in $PKGS; do args+=("-p" "$p"); done
          cargo nextest run --profile ci-fast --lib --locked "${args[@]}" 2>&1 | tee nextest-fast.log

      - name: Warn on slow tests (>10s in ci-fast)
        # WO 40.3: in the PR fast profile (30s timeout), any test over 10s
        # is a budget concern. Emit a warning annotation so it's visible
        # in the PR check UI without failing the job.
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f nextest-fast.log ]; then
            exit 0
          fi
          # Strip ANSI, extract PASS/SLOW lines with duration > 10s.
          # nextest lines: "PASS [   1.234s] crate::binary tests::name"
          sed 's/\x1b\[[0-9;]*m//g' nextest-fast.log \
            | grep -E '^\s*(PASS|FAIL|SLOW|TIMEOUT|LEAK)\s+\[' \
            | awk -F'[][]' '{ gsub(/[[:space:]]/, "", $2); dur=$2; sub(/s$/, "", dur); if (dur+0 > 10) print $0 }' \
            > slow-warn.txt || true
          if [ -s slow-warn.txt ]; then
            echo "::warning::Tests in ci-fast exceeded 10s budget (30s timeout):"
            cat slow-warn.txt
          else
            echo "No tests exceeded 10s in ci-fast profile."
          fi