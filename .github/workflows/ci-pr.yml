name: CI (PR)

# PR gate: fast feedback only. Target <5 min.
# Runs on PRs to main/dev. Cancel-in-progress so a force-push
# supersedes the previous run.
on:
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_TOOLCHAIN: "1.88.0"

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Fast-fail gate. Lint repo files BEFORE installing Rust (no toolchain
  # needed for grep/python), then check formatting. Catches the regression
  # class that disabled the old workflows: unresolved merge-conflict
  # markers committed under benches/tasks/use_*.toml (commit 4028424 fixed
  # the source; this guard prevents recurrence).
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Lint repo files (conflict markers + TOML validity + bench schema)
        run: |
          set -euo pipefail
          # 1. No unresolved git merge-conflict markers in ANY tracked file.
          #    `<` / `>` are literal in ERE; the diff3 base marker `|||||||`
          #    must be escaped (| is the alternation operator).
          if git grep -nE '^(<<<<<<< |>>>>>>> |\|\|\|\|\|\|\| )' -- . ; then
            echo "::error::Unresolved git merge-conflict markers in tracked files."
            exit 1
          fi
          # 2. Every benches/tasks/*.toml must parse as valid TOML AND carry
          #    the required keys (WO 28.11 R2). The required-key set is
          #    pinned from real tasks (`name`, `difficulty`, `prompt`) —
          #    ponytail: heuristic ceiling; bump this set when a legitimate
          #    task lands without one of these keys (none today).
          python3 - <<'PY'
          import pathlib, sys
          try:
              import tomllib  # Python 3.11+; ubuntu-latest ships 3.12.
          except ModuleNotFoundError:
              print("::error::tomllib unavailable (need Python >=3.11 on the runner)")
              sys.exit(1)
          root = pathlib.Path("benches/tasks")
          required = ("name", "difficulty", "prompt")
          bad = []
          checked = 0
          if root.is_dir():
              for f in sorted(root.glob("*.toml")):
                  checked += 1
                  try:
                      data = tomllib.loads(f.read_text(encoding="utf-8"))
                  except Exception as e:
                      bad.append((str(f), f"Invalid TOML: {e}"))
                      continue
                  missing = [k for k in required if k not in data]
                  if missing:
                      bad.append((str(f), f"missing required keys: {missing}"))
          if bad:
              for f, e in bad:
                  print(f"::error file={f}::{e}")
              sys.exit(1)
          print(f"benches/tasks/: {checked} TOML files parse OK with required keys {required}")
          PY

      - name: Check artifact/install/release consistency
        run: bash scripts/check-artifact-consistency.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  # Shared gate: classify the PR change set once and expose the affected
  # cargo packages (or a docs-only/no-rust marker) as job outputs. Both
  # `clippy` and `fast-tests` depend on this so they skip themselves on
  # docs-only changes (WO 33.6). fetch-depth: 0 is required for
  # `git diff <base>..HEAD` to resolve the base ref.
  changes:
    runs-on: ubuntu-latest
    needs: fmt
    timeout-minutes: 3
    outputs:
      packages: ${{ steps.cls.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: cls
        name: Classify changed packages
        # github.base_ref is the PR target branch (e.g. dev) on PR events;
        # fall back to origin/dev for push-triggered runs.
        run: |
          base="origin/${{ github.base_ref || 'dev' }}"
          pkgs="$(bash scripts/changed-packages.sh "$base" 2>/dev/null || true)"
          echo "packages=$pkgs" >> "$GITHUB_OUTPUT"
          if [ "$pkgs" = "__NO_RUST_CHANGES__" ] || [ -z "$pkgs" ]; then
            echo "No Rust packages affected; clippy + fast-tests will skip."
          else
            echo "Affected packages: $pkgs"
          fi

  clippy:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.packages != '' && needs.changes.outputs.packages != '__NO_RUST_CHANGES__'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: pr-clippy

      - name: Run Clippy
        # Clippy is the compile gate: run on the full workspace even when
        # only a subset of packages changed tests, because a crate change
        # can break callers that the package-level filter doesn't compile.
        # --lib --bins (NOT --all-targets) skips test-target compilation
        # for PR speed. --features e2e-tests keeps the gated e2e crate
        # under the lint gate so it cannot silently rot (WO 28.10).
        # No separate `cargo check` step: clippy with `-D warnings` fails on
        # any compile error, and same-scope `cargo check` after clippy only
        # re-runs the build without adding coverage (WO 33.4).
        # Skipped entirely on docs-only changes (WO 33.6).
        run: cargo clippy --lib --bins --features e2e-tests --locked -- -D warnings

  fast-tests:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.packages != '' && needs.changes.outputs.packages != '__NO_RUST_CHANGES__'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: pr-tests

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run fast test suite (changed packages only, lib only, fail-fast)
        # Path-aware selection (WO 33.6): run nextest only for the packages
        # touched by the PR (+ their reverse-dep closure), not the whole
        # workspace. The `changes` job computes the list via
        # scripts/changed-packages.sh and exposes it as `packages`.
        # ci-fast profile: kind(lib), fail-fast=true, 60s slow-timeout.
        # Skipped entirely on docs-only changes (WO 33.6).
        env:
          PKGS: ${{ needs.changes.outputs.packages }}
        run: |
          set -euo pipefail
          args=()
          for p in $PKGS; do args+=("-p" "$p"); done
          cargo nextest run --profile ci-fast --lib --locked "${args[@]}"