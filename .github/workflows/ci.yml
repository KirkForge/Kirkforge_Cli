name: CI

on:
  push:
    branches: [main, dev, merge, "phase/**"]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUST_TOOLCHAIN: "1.88.0"

jobs:
  # Fast-fail gate. Lint repo files BEFORE installing Rust (no toolchain
  # needed for grep/python), then check formatting. Catches the regression
  # class that disabled the old workflows: unresolved merge-conflict
  # markers committed under benches/tasks/use_*.toml (commit 4028424 fixed
  # the source; this guard prevents recurrence).
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Lint repo files (conflict markers + TOML validity)
        run: |
          set -euo pipefail
          # 1. No unresolved git merge-conflict markers in ANY tracked file.
          #    `<` / `>` are literal in ERE; the diff3 base marker `|||||||`
          #    must be escaped (| is the alternation operator).
          if git grep -nE '^(<<<<<<< |>>>>>>> |\|\|\|\|\|\|\| )' -- . ; then
            echo "::error::Unresolved git merge-conflict markers in tracked files."
            exit 1
          fi
          # 2. Every benches/tasks/*.toml must parse as valid TOML.
          #    Catches the broken-TOML regression directly.
          python3 - <<'PY'
          import pathlib, sys
          try:
              import tomllib  # Python 3.11+; ubuntu-latest ships 3.12.
          except ModuleNotFoundError:
              print("::error::tomllib unavailable (need Python >=3.11 on the runner)")
              sys.exit(1)
          root = pathlib.Path("benches/tasks")
          bad = []
          if root.is_dir():
              for f in sorted(root.glob("*.toml")):
                  try:
                      tomllib.loads(f.read_text(encoding="utf-8"))
                  except Exception as e:
                      bad.append((str(f), str(e)))
          if bad:
              for f, e in bad:
                  print(f"::error file={f}::Invalid TOML: {e}")
              sys.exit(1)
          print("benches/tasks/: all TOML files parse OK")
          PY

      - name: Check artifact/install/release consistency
        run: bash scripts/check-artifact-consistency.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  quality:
    runs-on: ubuntu-latest
    needs: fmt
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests (nextest; PR=lib fast suite, push=full workspace)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cargo nextest run --locked --lib --no-fail-fast \
              --config 'profile.default.timeout-period="60s"' \
              --config 'profile.default.fail-timeout="10s"'
          else
            # --workspace no longer picks up the e2e suite since WO 28.10
            # gated it behind the `e2e-tests` feature. The dedicated `e2e`
            # job below runs it with the feature on every push to dev.
            cargo nextest run --locked --workspace --no-fail-fast \
              --config 'profile.default.timeout-period="60s"' \
              --config 'profile.default.fail-timeout="10s"'
            # Doctests are not collected by nextest by default. Run them
            # under plain cargo test, but with a hard wall-clock cap so a
            # hanging doctest cannot wedge the job (cargo test has no
            # per-test timeout of its own).
            timeout 300 cargo test --locked --doc --workspace --no-fail-fast
          fi

      - name: Run Clippy
        # --features e2e-tests keeps the gated e2e crate under the lint
        # gate so it cannot silently rot behind the feature flag (WO 28.10).
        run: cargo clippy --all-targets --features e2e-tests --locked -- -D warnings

      - name: Typecheck all targets
        # Same rationale as Clippy: include the e2e crate in the typecheck.
        run: cargo check --workspace --all-targets --features e2e-tests --locked

      - name: Lint Node SDK (eslint)
        run: |
          set -euo pipefail
          cd npm/kf-plugin
          npm ci
          npm run lint

  windows:
    runs-on: windows-latest
    needs: fmt
    timeout-minutes: 45
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run tests on Windows (nextest; 60s per-test timeout)
        shell: bash
        # `--workspace` no longer picks up the e2e suite since WO 28.10
        # gated it behind `required-features = ["e2e-tests"]`. The e2e
        # binary-spawn scenarios were the historic Windows-flake source;
        # they now run only in the dedicated `e2e` job below (Linux).
        run: |
          cargo nextest run --locked --workspace --no-fail-fast \
            --config 'profile.default.timeout-period="60s"' \
            --config 'profile.default.fail-timeout="10s"'

      - name: Build release binary on Windows
        run: cargo build --release --locked

  # Dedicated e2e suite (WO 28.10). The `e2e` integration test crate is
  # feature-gated (`required-features = ["e2e-tests"]`) so the default
  # `--workspace` runs above skip it. This job turns the feature on so
  # the full e2e suite still runs on every push to dev/main/merge —
  # without making every other job pay the compile + run cost.
  e2e:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run e2e suite
        run: |
          cargo nextest run --locked --test e2e --features e2e-tests --no-fail-fast \
            --config 'profile.default.timeout-period="60s"' \
            --config 'profile.default.fail-timeout="10s"'

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_MODEL: qwen2.5:0.5b
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ env.TEST_MODEL }}-${{ runner.os }}-${{ hashFiles('tests/integration_test.rs') }}
          restore-keys: |
            ollama-models-${{ env.TEST_MODEL }}-${{ runner.os }}-
            ollama-models-${{ env.TEST_MODEL }}-

      - name: Install and start Ollama
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:11434/api/tags >/dev/null 2>&1; then
              echo "Ollama ready"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:11434/api/tags >/dev/null || { echo "Ollama failed to start"; cat /tmp/ollama.log; exit 1; }

      - name: Pull test model
        shell: bash
        run: |
          if ! curl -fsS http://localhost:11434/api/tags | grep -q "${TEST_MODEL}"; then
            ollama pull "${TEST_MODEL}"
          else
            echo "Test model ${TEST_MODEL} already cached"
          fi

      - name: Run integration tests against Ollama
        run: cargo test --test integration_test -- --include-ignored

      - name: Run smoke tests
        run: cargo test --test smoke_test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # cargo-audit reads Cargo.lock directly; it does not compile the
      # workspace, so the pinned toolchain + rust-cache are not needed.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Block on critical/high CVSS + unsound only; lower severities are
      # warnings. Severity blocking is configured in .cargo/audit.toml
      # (severity_threshold); --deny only accepts advisory *categories*.
      - name: Audit dependencies (critical/high/unsound)
        run: cargo audit --deny unsound

      - name: Audit dependencies (informational warnings)
        if: always()
        continue-on-error: true
        run: cargo audit

  coverage:
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info
