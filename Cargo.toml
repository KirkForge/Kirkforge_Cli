[package]
name = "kf-code"
version = "0.3.10"
edition = "2021"
description = "Provider-agnostic, verification-first coding agent"
repository = "https://github.com/KirkForge/KirkForge-Cli"
license = "MIT"
keywords = ["ai", "coding-agent", "llm", "tui", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[workspace]
members = [
    "crates/kf-bench",
    "crates/kf-budget-core",
    "crates/kf-compress-core",
    "crates/kf-context-index",
    "crates/kf-lsp",
    "crates/kf-memory-store",
    "crates/kf-plugin-host",
    "crates/kf-plugin-sdk",
    "crates/kf-rbac",
    "crates/kf-orchestrator",
    "crates/kf-routing",
    "crates/kf-testdoctor",
    "crates/kf-workflow",
]
default-members = [
    "crates/kf-bench",
    "crates/kf-budget-core",
    "crates/kf-compress-core",
    "crates/kf-context-index",
    "crates/kf-lsp",
    "crates/kf-memory-store",
    "crates/kf-orchestrator",
    "crates/kf-plugin-host",
    "crates/kf-plugin-sdk",
    "crates/kf-rbac",
    "crates/kf-routing",
    "crates/kf-testdoctor",
    "crates/kf-workflow",
    ".",
]
resolver = "2"

# Binary root lives at `src/main/mod.rs` (split into submodules for the
# event-emission / path-resolution seam). Cargo auto-detects `src/main.rs`
# but not the dir form, so point the `kf-code` bin at it explicitly.
[[bin]]
name = "kf-code"
path = "src/main/mod.rs"

[[bench]]
name = "startup"
harness = false

[[bench]]
name = "first_token_latency"
harness = false

[workspace.dependencies]
kf-plugin-sdk = { path = "crates/kf-plugin-sdk" }
kf-plugin-host = { path = "crates/kf-plugin-host" }
kf-lsp = { path = "crates/kf-lsp" }
kf-workflow = { path = "crates/kf-workflow" }
kf-context-index = { path = "crates/kf-context-index" }
kf-bench = { path = "crates/kf-bench" }
kf-compress-core = { path = "crates/kf-compress-core" }
kf-testdoctor = { path = "crates/kf-testdoctor" }
kf-budget-core = { path = "crates/kf-budget-core" }
kf-routing = { path = "crates/kf-routing" }
kf-rbac = { path = "crates/kf-rbac" }
kf-memory-store = { path = "crates/kf-memory-store" }
kf-orchestrator = { path = "crates/kf-orchestrator" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
clap = { version = "4", features = ["derive", "env"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
thiserror = "2"
toml = "0.8"
tempfile = "3"
directories = "6"
# Regex for the testdoctor source-analysis heuristics (WO 12.6). Shared
# via workspace so the testdoctor (a separate bin) can opt in without
# adding a duplicate version. The main binary already pulls regex via
# web_fetch (see [dependencies] below).
regex = "1"

[dependencies]
thiserror.workspace = true
# Test doctor (WO 12.4) — workspace member, called from `kf-code doctor`.
kf-testdoctor = { path = "crates/kf-testdoctor" }
# Orchestrator pipeline (WO 35.6) — ModelClient production impl lives in
# src/session/executor_adapter.rs. Drags kf-routing + kf-memory-store
# (and rusqlite) into the binary; accepted because the WO 35 line
# converges the binary on this crate (ParallelOrchestrator follow-up
# needs delegate + memory regardless).
kf-orchestrator = { workspace = true }

# TUI
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable"] }
# `bracketed-paste` unlocks `Event::Paste(String)` so pasted text is
# detectable (WO 30.0.11); without it, paste arrives as individual Char
# keystrokes indistinguishable from typing.
crossterm = { version = "0.29", features = ["event-stream", "bracketed-paste"] }

# Async
tokio.workspace = true
tokio-stream = "0.1"
tokio-util = "0.7"

# Unix process control (setsid for background daemon detachment)
libc = "0.2"

# File-system watcher for plugin hot-reload (WO 11.4, ADR-059).
# notify-debouncer-mini bundles notify + a debounce layer; smaller API
# than notify alone. Pure Rust on Linux (inotify), macOS (FSEvents),
# Windows (ReadDirectoryChangesW).
notify-debouncer-mini = "0.7"

# Serialization
serde.workspace = true
serde_json.workspace = true

# HTTP client (Ollama API)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# Error handling
anyhow.workspace = true

# CLI args
clap.workspace = true
clap_complete = "4"

# Async trait support
async-trait.workspace = true

# Config
toml.workspace = true
directories.workspace = true

# System prompt templating — mini-renderer in src/session/prompt/mod.rs
# ({{var}}, {{#if}}, {{#each}} only). Replaces handlebars (pest stack,
# ~300-500 KB) for a single template with 3 construct types.

# Line-mode history and editing. 16 dedupes unicode-width (0.1 → 0.2)
# with the rest of the workspace.
rustyline = "16"

# Diff display
similar = "2"

# Logging
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Glob pattern matching
globset = "0.4"

# Regex for lightweight HTML-to-text stripping in web_fetch (kept small;
# the full html5ever/scraper path is intentionally deferred per ADR-0001).
regex = "1"

# File system helpers
ignore = "0.4"
shellexpand = "3"

# Tree-sitter for AST-based minification (WO 17.4).
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.23"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-bash = "0.23"

# Date/time for session IDs and scheduled-job timezone support
chrono.workspace = true
chrono-tz.workspace = true

# Cron expression parsing for scheduled jobs
cron = "0.15"

# Text wrapping for chat display
textwrap = "0.16"

# Markdown rendering for assistant messages
pulldown-cmark = "0.13"

# Base64 for image-attach (read_image tool / multimodal messages).
# 0.23 unifies with tiktoken's base64 — single copy in the graph.
base64 = "0.23"

# Constant-time comparison for daemon auth token checks.
subtle = "2"

# Clipboard for Ctrl+Shift+C copy. Default features off drops the
# image-data path (image → png → flate2) — the only call site is
# `set_text` (src/tui/clipboard.rs), which needs text-only.
arboard = { version = "3", default-features = false }

# Rust-native plugin SDK (vendored workspace members)
kf-plugin-sdk = { workspace = true }
kf-plugin-host = { workspace = true }
# LSP client pool (vendored workspace member) — symbol-aware code nav.
kf-lsp = { workspace = true }
# Workflow engine (vendored workspace member) — programmable JSON workflows.
kf-workflow = { workspace = true }
# Repo-graph context index (tree-sitter-backed symbol extraction).
kf-context-index = { workspace = true }
# Task-benchmark harness (TOML tasks, headless runs, metrics collection).
kf-bench = { workspace = true }
# Stratum context compression (optional; default on).
kf-compress-core = { workspace = true, optional = true }
# Headless Chrome CDP driver for the computer_use tool. Optional — the
# `computer_use` feature enables it. Default builds exclude it (~1-2 MB
# saved). PlaceholderTab (pure Rust) keeps the tool compiling without it.
headless_chrome = { version = "1", default-features = false, optional = true }
# SigV4 signing for Anthropic-on-Bedrock requests. 1.3+ modernizes the
# smithy stack (aws-smithy-http 0.63 / runtime-api 1.11). NOTE: `sign-http`
# (the `http_request` module our Bedrock signing uses) still requires http 0.2
# for its canonical-request internals, and aws-smithy-http's default features
# keep http-body 0.4 alive via aws-smithy-types — the http 0.2/http-body 0.4
# dedup hoped for in WO 43.20 is NOT achievable while using `http_request`;
# `http1` is enabled so the module's http 1.x types resolve.
aws-sigv4 = { version = "1.3", default-features = false, features = ["sign-http", "http1"] }
aws-credential-types = { version = "1.2", default-features = false }
aws-smithy-runtime-api = { version = "1.7.3", default-features = false }
futures-util = "0.3"
# SHA-256 hashing required by the custom SigV4 payload hash + audit chain (WO 29.4).
sha2 = "0.10"
# HMAC-SHA256 for the keyed audit hash chain (WO 29.4).
hmac = "0.12"
hex = "0.4"
# Google OAuth2 / service-account access tokens for Anthropic-on-Vertex.
yup-oauth2 = { version = "12", default-features = false, features = ["hyper-rustls", "ring", "service-account"] }
# Re-exported by reqwest but also used directly for SigV4 request signing.
http = "1"
url = "2"
percent-encoding = "2"
# Cache serialization uses serde_json (already a dependency) instead of
# the unmaintained bincode crate.
# Temp directory creation for benchmark harness.
# Budget guard (optional — feature-gated behind "budget").
kf-budget-core = { workspace = true, optional = true }
tempfile.workspace = true
# RBAC permission tiers for the daemon (WO 43.6). Maps the daemon auth token
# to an Actor with a role (KF_CODE_DAEMON_ROLE, fallback admin) and checks
# per-op permissions. Single-token deployments keep admin behavior.
kf-rbac = { workspace = true }

# PTY support for interactive bash commands (WO 21.5-R2, feature-gated).
# ponytail: ~2 MB binary cost; opt-in via --features pty.
portable-pty = { version = "0.8", optional = true }

# Seccomp-bpf syscall filter for bash subprocesses (WO 30.4, feature-gated).
# Pure-Rust BPF compiler; only pulls in libc (already a dep). Linux-only by
# nature (seccompiler itself only builds on little-endian x86_64/aarch64/riscv64).
# ponytail: opt-in via --features seccomp until allowlist is exercised on real workloads.
seccompiler = { version = "0.5", optional = true }

[dev-dependencies]
# Property-based testing for edit-file diff application and other invariants.
proptest = "1.6"
# Statistical benchmarking harness for first-token latency.
criterion = { version = "0.5", features = ["async_tokio"] }
# HTTP mock server for Ollama adapter integration tests without a live model.
wiremock = "0.6"
# WO 40.5: serializes tests that mutate process-global OnceLock registries
# (SESSION_MODE) which cannot be dependency-injected. Zero binary-size impact
# (dev-dep only).
serial_test = "3"
# WO 45.61: generates real minisign signatures in loader tests to reproduce
# the signed-manifest + swapped-script attack. Already in the workspace
# lockfile via kf-plugin-host; dev-dep only, zero binary-size impact.
minisign = "0.9"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"
required-features = ["e2e-tests"]

[features]
default = ["stratum", "budget", "kf-plugin-tools"]
stratum = ["dep:kf-compress-core"]
budget = ["dep:kf-budget-core"]
# e2e-tests: gate the slow e2e integration suite (tests/e2e/) behind an
# opt-in feature so `cargo test --workspace` / `cargo check --all-targets`
# skip it by default (WO 28.10). CI runs it in a dedicated job with
# --features e2e-tests.
e2e-tests = []
# kf-plugin-tools: register the six `kf-plugin` tools as compiled-in Rust
# impls (WO 29.1). doctor/health/tools run natively; verify runs the
# security emitter (WO 35.6); audit_verify walks the hash chain (WO 35.6);
# verify_workspace reports not-implemented (reducer pending wiring). The
# shell/Node fallback that lived under plugins/kf-plugin/ was removed in
# WO 29.9 when the TS tree was deleted; with the feature off, no kf-plugin
# tools are registered.
 kf-plugin-tools = []
  pty = ["portable-pty"]
# computer_use: Anthropic hosted computer_use beta (coordinate-vision model).
# Adapter wire format only (`computer` tool type + `anthropic-beta` header +
# `computer_tool_result` stream parsing). Enables the `headless_chrome` dep
# so local Chrome execution is compiled in. Default OFF: opt in via
# --features computer_use. The vision execution loop (R4) is deferred — see
# WO 28.16.
# ponytail: meaningful capability + cost + binary-size surface; users opt in
# explicitly. Default builds use PlaceholderTab (no Chrome).
# ceiling: FROZEN (WO 47.11) — keep default-off, invest nothing beyond
# security fixes. Unfreeze only if Claude-compat computer-use demand
# materializes; delete only as a dedicated cross-cutting WO (the wire format
# + config surface spans ~21 files, not just this feature).
computer_use = ["dep:headless_chrome"]
# seccomp: Linux seccomp-bpf syscall filter for bash subprocesses (WO 30.4).
# Applied in the pre_exec hook alongside landlock + rlimits. Confines the
# syscall surface to an allowlist (everything else -> EPERM, graceful). Default
# OFF: opt in via --features seccomp. The allowlist is a starting set tuned for
# bash + common tools (grep/sed/awk/curl/cargo/node/python) + the glibc startup
# syscalls; real-workload tuning is deferred (see WO 30.4). Brings in the
# `seccompiler` crate (pure-Rust BPF compiler, no C deps).
# ponytail: opt-in until exercised against real workloads; ceiling noted in
# src/session/bash_runner/seccomp.rs.
seccomp = ["dep:seccompiler"]
# landlock: no longer a Cargo feature — the module is always compiled on
# Linux via cfg(target_os = "linux") and applies by default (WO 27.1).
# Operators escape via --i-accept-unsandboxed on kernels where restrict_self
# errors; landlock_extra_paths in config.toml extends the allow-list.
# Enable OpenTelemetry span/metric export from the Rust runtime.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]

[dependencies.opentelemetry]
version = "0.29"
optional = true

[dependencies.opentelemetry-otlp]
version = "0.29"
optional = true
features = ["trace", "metrics", "grpc-tonic"]

[dependencies.opentelemetry_sdk]
version = "0.29"
optional = true
features = ["trace", "metrics", "rt-tokio"]

[dependencies.tracing-opentelemetry]
version = "0.30"
optional = true

[build-dependencies]
clap_mangen = "0.2"
clap.workspace = true
clap_complete = "4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# ponytail: panic=abort is a binary-size pin (state.md). ceiling: it makes
# every catch_unwind containment guard (executor/dispatch.rs tool guard,
# verifier bus.rs/handler.rs guards) dead in release — a panic aborts the
# process; the WO 38.2 panic hook restores the terminal first. The guards
# stay: they are load-bearing in dev/test builds (unwind). Upgrade path:
# switch to unwind + measure binary size if tool-panic containment is ever
# needed in production (WO 47.23 contract).
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

# WO 44.44: Windows Job Objects for process-tree kill on timeout. Already in
# the lock graph via kf-memory-store's Windows PID probe; target-gated so
# Linux/macOS builds pay zero size cost.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }
