name = "add_adr"
difficulty = "hard"
requires_model = true

prompt = "Write an Architecture Decision Record (ADR) numbered 062 for a benchmark-delta-comparison feature. Create the file at docs/adr/062-benchmark-delta-comparison.md following the existing ADR format. The ADR should document: Context (need to compare benchmark runs across commits), Decision (add delta comparison to bench reports with pairwise success-rate diff, token diff, and cost diff), Status (Accepted), and Consequences. Also update docs/adr/README.md to include the new ADR."

[setup]
"docs/adr/README.md" = """# Architecture Decision Records

Index of all ADRs in this repo.

| Number | Title | Status |
|--------|-------|--------|
| 060 | Foo | Accepted |
| 061 | Bar | Accepted |
"""
"docs/adr/060-foo.md" = "# ADR-060: Foo\n\nStatus: Accepted\n\n## Context\n\nFoo.\n\n## Decision\n\nFoo.\n\n## Consequences\n\nFoo.\n"
"docs/adr/061-bar.md" = "# ADR-061: Bar\n\nStatus: Accepted\n\n## Context\n\nBar.\n\n## Decision\n\nBar.\n\n## Consequences\n\nBar.\n"

[verify]
type = "file_contains"
path = "docs/adr/062-benchmark-delta-comparison.md"
contains = "Status: Accepted"
