name = "extract_trait"
difficulty = "hard"

prompt = "Extract a trait named `LoggerLike` from the `Logger` struct's impl block in src/lib.rs. The trait should declare `info` and `warn` as methods taking `&self` and a `&str` message. Change `impl Logger { ... }` so the methods satisfy `impl LoggerLike for Logger { ... }`. Update `notify` so its parameter is `&impl LoggerLike` instead of `&Logger`. The project should still compile. Do not change the public signatures of `info` or `warn`."

[setup]
"Cargo.toml" = """[package]
name = "extract_trait"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
"""
"src/lib.rs" = """pub struct Logger;

impl Logger {
    pub fn info(&self, msg: &str) {
        eprintln!("[info] {msg}");
    }

    pub fn warn(&self, msg: &str) {
        eprintln!("[warn] {msg}");
    }
}

pub fn notify(logger: &Logger, msg: &str) {
    logger.info(msg);
}
"""

[verify]
type = "file_contains"
path = "src/lib.rs"
contains = "trait"