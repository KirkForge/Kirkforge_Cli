name = "fix_clippy_warning"
difficulty = "easy"

prompt = "Fix the clippy warning `new_without_default` on `Holder` in src/lib.rs by adding a `Default` impl that delegates to `Holder::new()`."

[setup]
"Cargo.toml" = """[package]
name = "fix_clippy_warning"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
"""
"src/lib.rs" = """pub struct Holder {
    items: Vec<String>,
}

impl Holder {
    #[must_use]
    pub fn new() -> Self {
        Self { items: Vec::new() }
    }

    pub fn add(&mut self, item: String) {
        self.items.push(item);
    }

    pub fn count(&self) -> usize {
        self.items.len()
    }
}
"""

[verify]
type = "command_exits_zero"
command = "cargo clippy --all-targets -- -D warnings"
