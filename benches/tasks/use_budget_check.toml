name = "use_budget_check"
difficulty = "medium"
requires_model = true
kf_only = true

prompt = "This project uses a token budget guard. A config.toml at the repo root pins the token budget ceiling to 1000 tokens (low for testing). Use the budget_status tool to check the current usage, then write the result to budget_report.txt."

[setup]
"Cargo.toml" = """[package]
name = "use_budget_check"
version = "0.1.0"
edition = "2021"
"""
"config.toml" = """[tools]
budget_ceiling = 1000
budget_approaching_ratio = 0.5
"""

[verify]
type = "file_contains"
path = "budget_report.txt"
contains = "budget"
