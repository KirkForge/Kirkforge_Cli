name = "use_lsp_query"
difficulty = "medium"
requires_model = true
kf_only = true

prompt = "The file src/lib.rs contains a Rust function `greet` that takes a name and returns a String. Use the lsp_query tool with operation=document_symbols on src/lib.rs to discover the symbol. Then write the symbol name to symbols.txt."

[setup]
"Cargo.toml" = """[package]
name = "use_lsp_query"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
"""
"src/lib.rs" = """pub fn greet(name: &str) -> String {
    format!("Hello, {name}!")
}
"""

[verify]
type = "file_contains"
path = "symbols.txt"
contains = "greet"
