name = "use_lsp_query"
difficulty = "medium"

prompt = "The file src/lib.rs contains a Rust function `greet` that takes a name and returns a String. Use the lsp_query tool with operation=document_symbols on src/lib.rs to discover the symbol. The lsp_query tool requires an LSP server configured for Rust (e.g. rust-analyzer) in config.toml; without one, the tool will return an error rather than fake results. The symbol list should include 'greet' as a function."

[setup]
"Cargo.toml" = """[package]
name = "use_lsp_query"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
"""
"src/lib.rs" = """pub fn greet(name: &str) -> String {
    format!("Hello, {name}!")
}
"""

[verify]
type = "file_contains"
path = "src/lib.rs"
contains = "pub fn greet"
