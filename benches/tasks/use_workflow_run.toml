name = "use_workflow_run"
difficulty = "medium"
requires_model = true

prompt = "A workflow template lives at .kf-code/workflows/feature.json (already in the sandbox). Use the workflow_run tool with template='feature' and vars={feature: 'auth'} to run it. The tool should return JSON with a 'steps' array; each step has a 'summary' field. After running, write the step summaries to workflow_output.txt, one per line."

requires_model = true

[setup]
"Cargo.toml" = """[package]
name = "use_workflow_run"
version = "0.1.0"
edition = "2021"
"""
".kf-code/workflows/feature.json" = """{
  "name": "feature",
  "steps": [
    {"name": "explore", "prompt": "Map the codebase areas relevant to ${feature}.", "persona": "explore"},
    {"name": "plan", "prompt": "Design a step-by-step implementation plan for ${feature}, based on the exploration summary.", "persona": "plan", "depends_on": ["explore"]}
  ]
}
"""

[verify]
type = "output_contains"
pattern = "steps"
