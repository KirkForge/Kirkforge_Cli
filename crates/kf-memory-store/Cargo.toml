[package]
name = "kf-memory-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/KirkForge/KirkForge-Cli"
description = "Routing-oriented memory store: MemoryStore facade + JSON-file and SQLite adapters (port of @kirkforge/memory-palace)"

[dependencies]
kf-routing = { workspace = true }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
sha2 = "0.10"
hex = "0.4"
tempfile = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
