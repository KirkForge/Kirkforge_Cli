[package]
name = "kf-orchestrator"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/KirkForge/KirkForge-Cli"
description = "Orchestrator delegation + decompose + correction pipeline + mode executors (port of @kirkforge/orchestrator)"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "fs", "io-util", "sync", "macros", "time"] }
# WO 36.5: CancellationToken for BriefCancel — the cooperative-cancel
# token the production adapter threads into the subagent executor.
# Same version the root package already links; no size change.
tokio-util = "0.7"
async-trait.workspace = true
tracing.workspace = true
tempfile = { workspace = true }
regex = { workspace = true }
base64 = "0.23"
sha2 = "0.10"
hex = "0.4"
# Memory-store adapters (folded from kf-memory-store, WO 47.4): bundled
# SQLite backend + platform PID probes for stale-lock detection.
rusqlite = { version = "0.40", features = ["bundled", "backup"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = { workspace = true }
proptest = "1.6"
tokio = { workspace = true, features = ["rt", "macros", "time"] }
