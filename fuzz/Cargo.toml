[package]
name = "kf-code-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
kf-code = { path = ".." }
arbitrary = "1"

[[bin]]
name = "minify_rust"
path = "fuzz_targets/minify_rust.rs"

[[bin]]
name = "minify_revalidate"
path = "fuzz_targets/minify_revalidate.rs"

[[bin]]
name = "ndjson_parse"
path = "fuzz_targets/ndjson_parse.rs"

[[bin]]
name = "config_parser"
path = "fuzz_targets/config_parser.rs"

[[bin]]
name = "deny_list"
path = "fuzz_targets/deny_list.rs"
